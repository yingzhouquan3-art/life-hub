<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12141a">
<title>生活中枢 · 随手记</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<style>
  :root {
    --bg: #12141a; --card: #1b1e26; --line: #2a2e3a;
    --text: #e8eaf0; --muted: #8f96a8; --accent: #f0b429; --ok: #4ade80; --warn: #fb923c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  header { padding: 18px 16px 8px; }
  h1 { margin: 0; font-size: 19px; letter-spacing: .04em; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  main { padding: 8px 16px 40px; display: grid; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .card h2 { margin: 0 0 10px; font-size: 14px; color: var(--muted); font-weight: 600; letter-spacing: .06em; }
  textarea, input, select {
    width: 100%; background: #0f1117; color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: inherit;
  }
  textarea { min-height: 76px; resize: vertical; }
  button {
    width: 100%; padding: 13px; border: 0; border-radius: 10px;
    background: var(--accent); color: #1a1205; font: 600 16px/1 inherit; margin-top: 10px;
  }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  button:disabled { opacity: .5; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .field { margin-top: 8px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .pill { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px;
          background: #262a35; color: var(--muted); margin: 0 6px 6px 0; }
  .pill.on { background: var(--accent); color: #1a1205; }
  .warn { color: var(--warn); font-size: 13px; margin-top: 6px; }
  .muted { color: var(--muted); font-size: 13px; }
  .stat { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .stat:last-child { border-bottom: 0; }
  .cap { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; }
  .cap .amt { font-size: 20px; font-weight: 700; }
  /* 今天要做的：手指点的目标至少 44px 高，站着单手也点得中 */
  .tick {
    display: flex; align-items: center; gap: 11px; width: 100%;
    min-height: 46px; padding: 8px 10px; margin: 0 0 7px;
    border: 1px solid var(--line); border-radius: 10px;
    background: transparent; color: var(--text); font: inherit; text-align: left;
  }
  .tick .box {
    flex: 0 0 22px; height: 22px; border: 1.5px solid var(--line);
    border-radius: 6px; display: grid; place-items: center; font-size: 14px; color: transparent;
  }
  .tick.on .box { border-color: var(--accent); background: var(--accent); color: #1a1205; }
  .tick.on .name { color: var(--muted); text-decoration: line-through; }
  .tick .name { flex: 1; min-width: 0; font-size: 15px; }
  .tick .meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .tick.late .meta { color: var(--warn); }
  .tick:disabled { opacity: .55; }
  .group { margin-bottom: 12px; }
  .group:last-child { margin-bottom: 0; }
  .group h3 { margin: 0 0 7px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .banner { padding: 10px 14px; font-size: 13px; text-align: center;
            display: flex; align-items: center; justify-content: center; gap: 4px; }
  .banner.hidden { display: none; }
  .banner.offline { background: #3a2a12; color: var(--warn); }
  .banner.ok { background: #14301f; color: var(--ok); }
  .banner__action {
    /* 手机上的点击目标：和打卡行一样按 44px 起，站着单手也点得中 */
    width: auto; min-height: 40px; margin: 0 0 0 10px; padding: 0 18px;
    border-radius: 999px; background: rgba(255,255,255,.16); color: inherit;
    font: 600 14px/1 inherit; vertical-align: middle;
  }
  .banner__action:disabled { opacity: .5; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="banner" class="banner hidden"></div>

<header>
  <h1>随手记</h1>
  <div class="sub" id="subtitle">生活中枢 · 手机端</div>
</header>

<main>
  <section class="card">
    <h2>一句话记录</h2>
    <textarea id="quickText" placeholder="跑步 30 分钟 强度 6&#10;午饭 16.5 支付宝&#10;睡了 7 小时 精力 4"></textarea>
    <button id="parseBtn">解析</button>

    <div id="preview" class="hidden">
      <div class="field">
        <label>落到哪个模块</label>
        <div id="modulePills"></div>
      </div>
      <div id="previewFields"></div>
      <div id="previewWarnings"></div>
      <button id="commitBtn">确认写入</button>
      <button id="cancelBtn" class="ghost">取消</button>
    </div>
  </section>

  <section class="card">
    <h2>今天要做的</h2>
    <div id="rhythmList" class="muted">加载中…</div>
  </section>

  <section class="card">
    <h2>待确认捕获</h2>
    <div id="captureList" class="muted">加载中…</div>
  </section>

  <section class="card">
    <h2>今天记了什么</h2>
    <div id="todayList" class="muted">加载中…</div>
  </section>

  <section class="card">
    <h2>连接</h2>
    <div id="connInfo" class="muted"></div>
    <div id="installHint" class="muted" style="margin-top:8px; line-height:1.6"></div>
    <button id="syncBtn" class="ghost">立即同步离线队列</button>
  </section>
</main>

<script src="./app.js?v=20260822-ux-2"></script>
</body>
</html>
