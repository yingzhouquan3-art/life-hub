<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090910">
  <title>登录 · 我的生活中枢</title>
  <link rel="stylesheet" href="/login.css?v=20260821-cloud-1">
</head>
<body>
  <main class="login-shell">
    <section class="login-card">
      <div class="login-mark" aria-hidden="true">生</div>
      <span class="eyebrow">MY LIFE · PRIVATE</span>
      <h1>回到我的生活中枢</h1>
      <p>这里包含你的账本、健康与生活记录。云端访问必须先验证身份。</p>
      <form id="login-form">
        <label for="password">访问密码</label>
        <input id="password" name="password" type="password" minlength="12" maxlength="256" autocomplete="current-password" autofocus required>
        <button id="login-button" type="submit">进入我的中枢</button>
        <p class="status" id="login-status" hidden role="alert"></p>
      </form>
      <small>密码只交给当前生活中枢，不会写入账本或浏览器地址。</small>
    </section>
  </main>
  <script>
    const form = document.querySelector('#login-form');
    const input = document.querySelector('#password');
    const button = document.querySelector('#login-button');
    const status = document.querySelector('#login-status');
    const requested = new URLSearchParams(location.search).get('next') || '/';
    const destination = requested.startsWith('/') && !requested.startsWith('//') ? requested : '/';

    fetch('/api/auth/status').then(r => r.json()).then(state => {
      if (state.authenticated) location.replace(destination);
    }).catch(() => {});

    form.addEventListener('submit', async event => {
      event.preventDefault();
      button.disabled = true;
      status.hidden = true;
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({password: input.value}),
        });
        if (!response.ok) {
          const payload = await response.json().catch(() => ({}));
          throw new Error(payload.detail || '暂时无法登录，请稍后再试。');
        }
        location.replace(destination);
      } catch (error) {
        status.textContent = error.message;
        status.hidden = false;
        input.select();
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
